<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page de Test — test.html</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent);
      color: #082f49;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 0.7rem 1.2rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    button:active {
      transform: scale(0.98);
    }

    .counter {
      font-size: 0.95rem;
      color: var(--text);
      background: rgba(15, 23, 42, 0.5);
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">HTML5 • CSS3 • JS</span>
    <h1>Salam! Hadi page test.html</h1>
    <p>
      Ila katcheuf had l-page mzyana, rah l-fichier HTML khddam bla mouchkil. Bddel ay haja bghiti hna bach t-testi l-design dyalk.
    </p>

    <div class="actions">
      <button id="clickBtn" type="button">Cliquez ici</button>
      <span class="counter" id="counterText">Clics : 0</span>
    </div>
  </main>

  <script>
    let count = 0;
    const btn = document.getElementById("clickBtn");
    const counterText = document.getElementById("counterText");

    btn.addEventListener("click", () => {
      count += 1;
      counterText.textContent = `Clics : ${count}`;
    });
  </script>
</body>
</html>
