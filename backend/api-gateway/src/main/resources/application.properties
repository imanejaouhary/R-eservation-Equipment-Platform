spring.application.name=api-gateway
server.port=8080

# Connexion au Config Server
spring.config.import=optional:configserver:http://localhost:8888

# Connexion à Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enregistrer API Gateway dans Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# Routes de l'API Gateway vers les Services
# ==========================================

# 1. Route test Eureka
spring.cloud.gateway.server.webflux.routes[0].id=discovery-test
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/eureka-test/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/

# 2. Route Reservation Service
spring.cloud.gateway.server.webflux.routes[1].id=reservation-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reservations/**

# 3. Route Equipment Service
spring.cloud.gateway.server.webflux.routes[2].id=equipment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://EQUIPMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/equipments/**

# 4. Route User Service
spring.cloud.gateway.server.webflux.routes[3].id=user-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/users/**

# 5. Route Payment Service
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**
