spring.application.name=equipment-service
server.port=8082

# =============================================
# Spring Cloud Config Server
# =============================================
# En local : Config Server sur localhost:8888
# En Docker : surchargé par la variable d'environnement SPRING_CONFIG_IMPORT
spring.config.import=optional:configserver:http://localhost:8888

# =============================================
# Eureka Client
# =============================================
# En local : Eureka sur localhost:8761
# En Docker : surchargé par EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =============================================
# PostgreSQL DataSource
# =============================================
# 127.0.0.1 est utilisé explicitement pour forcer IPv4 (localhost peut résoudre en ::1 sur Windows,
# alors que le port Docker est lié sur 127.0.0.1:5432 uniquement).
# En Docker : SPRING_DATASOURCE_URL surchargée par docker-compose (hostname "postgres").
# En local : POSTGRES_USER et POSTGRES_PASSWORD doivent être définis dans l'environnement
# système (PowerShell : $env:POSTGRES_USER="...") ou via EnvFile/IntelliJ.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/equipment_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
